<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>三目标日常规划器 · 小布出品</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --pri:#4f7cff; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
    --english:#6366f1; --fitness:#10b981; --license:#f59e0b; --work:#94a3b8;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 70px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{font-size:24px}
  .brand h1{font-size:18px;margin:0;font-weight:700}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .ring{position:relative;width:62px;height:62px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  nav.tabs{display:flex;gap:5px;background:var(--card);padding:6px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px}
  nav.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600}
  nav.tabs button.active{background:var(--pri);color:#fff}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .goal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
  .goal-head .l{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .chip{font-size:11px;background:#f1f3f9;color:var(--muted);padding:2px 8px;border-radius:20px;white-space:nowrap}
  .bar{height:8px;background:#eef1f6;border-radius:20px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;border-radius:20px;transition:width .3s}
  .task{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
  .task:first-of-type{border-top:0}
  .task input{width:20px;height:20px;accent-color:var(--pri);cursor:pointer;flex:0 0 auto}
  .task label{flex:1;cursor:pointer}
  .task.done label{text-decoration:line-through;color:var(--muted)}
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .datebar .nav{display:flex;gap:10px;align-items:center}
  .datebar .nav > div{text-align:center}
  .ibtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
  .countdown{font-size:12px;padding:5px 9px;border-radius:8px;background:#fff7e6;color:#9a6a00;border:1px solid #ffe2a8;white-space:nowrap}
  .weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .weekgrid .cell{background:var(--card);border-radius:10px;padding:8px 4px;text-align:center;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:.15s}
  .weekgrid .cell:hover{transform:translateY(-1px)}
  .weekgrid .cell.sel{border-color:var(--pri)}
  .weekgrid .cell .wd{font-size:11px;color:var(--muted)}
  .weekgrid .cell .dt{font-size:13px;font-weight:700;margin:2px 0}
  .weekgrid .cell .mini{height:6px;border-radius:6px;background:#eef1f6;margin-top:5px;overflow:hidden}
  .weekgrid .cell .mini i{display:block;height:100%}
  .stat-row{display:flex;gap:12px;flex-wrap:wrap}
  .stat-box{flex:1;min-width:120px;background:#f8fafc;border-radius:10px;padding:12px}
  .stat-box .n{font-size:22px;font-weight:800}
  .stat-box .t{font-size:12px;color:var(--muted);margin-top:2px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px;margin-bottom:18px}
  .bars .b{flex:1;background:linear-gradient(var(--pri),#9db5ff);border-radius:6px 6px 0 0;min-height:3px;position:relative}
  .bars .b span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
  .setting-row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .setting-row input[type=text]{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .setting-row input[type=number],.setting-row input[type=date],.setting-row input[type=time]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .btn{border:0;background:var(--pri);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:5px 9px;font-size:12px}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #fbd0d0}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .weightin{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .weightin input{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .sec-title{font-size:12px;font-weight:700;color:var(--muted);margin:4px 0 8px;text-transform:uppercase;letter-spacing:.05em}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px}
  /* plan */
  .blk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .blk:last-child{border-bottom:0}
  .blk .tm{font-size:12px;font-weight:700;width:90px;flex:0 0 auto;color:var(--ink)}
  .blk .gn{font-size:11px;padding:2px 7px;border-radius:20px;flex:0 0 auto}
  .blk .at{flex:1;font-size:13px}
  .blk .go{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:11px;cursor:pointer;flex:0 0 auto}
  /* resources */
  .res-link{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .res-link:last-child{border-bottom:0}
  .res-link a{color:var(--pri);text-decoration:none;flex:1}
  .res-link a:hover{text-decoration:underline}
  details.res{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
  details.res summary{cursor:pointer;font-weight:600;font-size:13px}
  details.res .body{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
  details.res .body b{color:var(--ink)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  /* quiz modal */
  .ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .ov .panel{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
  .q-prog{font-size:12px;color:var(--muted);margin-bottom:6px}
  .q-prompt{font-size:15px;font-weight:700;margin:6px 0 12px}
  .q-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;margin:7px 0;font-size:14px;cursor:pointer}
  .q-opt:hover{border-color:var(--pri)}
  .q-opt.correct{background:#ecfdf5;border-color:#10b981;color:#065f46}
  .q-opt.wrong{background:#fef2f2;border-color:#ef4444;color:#991b1b}
  .q-opt:disabled{cursor:default}
  .q-exp{font-size:12px;color:var(--muted);background:#f8fafc;border-radius:8px;padding:8px 10px;margin:8px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;z-index:70}
  .toast.show{opacity:1}
  @media(max-width:560px){.brand h1{font-size:16px}.weekgrid{grid-template-columns:repeat(4,1fr)} .stat-box .n{font-size:19px} nav.tabs button{font-size:12px;padding:9px 2px}}
</style>

</head>
<body>
<div class="wrap">

    <div class="brand">
      <div class="logo">🧭</div>

        <h1>三目标日常规划器</h1>

</div>
<div class="toast" id="toast"></div>
<div class="ov" id="quiz" hidden><div class="panel" id="quizPanel"></div></div>

<script>
const KEY='planner_v1';
const WD=['日','一','二','三','四','五','六'];
function dk(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function parseDK(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayKey(){return dk(new Date());}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseHM(s){const p=s.split(':').map(Number);return p[0]*60+p[1];}
function fmtHM(m){const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

];

  {n:'居家全身燃脂 HIIT（约 20 分钟）',m:'开合跳 2′·深蹲 2′·跪姿俯卧撑 2′·高抬腿 2′·平板支撑 1′·登山跑 2′·休息 1′（重复一轮）',tip:'每动作做完休息 30 秒；每周 3-4 次；膝盖不适可降阶。'},
  {n:'晨间唤醒拉伸（约 8 分钟）',m:'颈部环绕 1′·肩部环绕 1′·站立体前屈 1′·弓步拉伸每侧 1′·猫牛式 1′·婴儿式 1′',tip:'动作缓慢配合呼吸，每天起床后做，唤醒身体。'},
  {n:'晚间快走 / 慢跑',m:'快走或慢跑 30-45 分钟',tip:'饭后 1 小时进行；强度以"能说话但唱不出歌"为准。'}
];

let state=null, selectedDate=todayKey(), currentView='day';
function load(){
  try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):JSON.parse(JSON.stringify(DEFAULT));}
  catch(e){state=JSON.parse(JSON.stringify(DEFAULT));}
  if(!state.logs)state.logs={};

function getGoal(id){return state.goals.find(g=>g.id===id);}
function getLog(date){if(!state.logs[date])state.logs[date]={};return state.logs[date];}

function goalProgress(goal,date){const log=getLog(date);const total=goal.tasks.length;let done=0;goal.tasks.forEach(t=>{if(log[t.id])done++;});return {done,total,pct:total?Math.round(done/total*100):0};}
function overallProgress(date){let total=0,done=0;state.goals.forEach(g=>{const p=goalProgress(g,date);total+=p.total;done+=p.done;});return {done,total,pct:total?Math.round(done/total*100):0};}
function streakForGoal(goal){let s=0,d=new Date();for(let i=0;i<400;i++){const k=dk(d);const p=goalProgress(goal,k);const full=p.total>0&&p.done===p.total;if(full){s++;d=addDays(d,-1);continue;}if(i===0){d=addDays(d,-1);continue;}break;}return s;}
function overallStreak(){let s=0,d=new Date();for(let i=0;i<400;i++){const k=dk(d);const p=overallProgress(k);const full=p.total>0&&p.done===p.total;if(full){s++;d=addDays(d,-1);continue;}if(i===0){d=addDays(d,-1);continue;}break;}return s;}

function stripTags(s){return String(s).replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();}
function normQ(raw){
  let q=stripTags(raw.question||raw.q||raw.tm||raw.title||'');
  let opts=raw.options||raw.o||raw.choices||raw.select||raw.itemsDescArray||raw.itemsDesc||raw.itemList||[];
  if(typeof opts==='string')opts=opts.split(/\n|[|｜]/).map(s=>s.trim()).filter(Boolean);
  else if(Array.isArray(opts))opts=opts.map(x=>stripTags(String(x))).filter(Boolean);
  let ans=raw.answer; if(ans===undefined)ans=raw.da; if(ans===undefined)ans=raw.ans; if(ans===undefined)ans=raw.correct;
  let aIdx=-1;
  if(typeof ans==='number')aIdx=ans;
  else if(typeof ans==='string'){ans=ans.trim();if(/^[A-Za-z]$/.test(ans))aIdx=ans.toUpperCase().charCodeAt(0)-65;else if(/^[0-9]+$/.test(ans))aIdx=parseInt(ans);else if(['对','正确','Y','yes','true','T'].indexOf(ans)>=0)aIdx=0;else if(['错','错误','N','no','false','F'].indexOf(ans)>=0)aIdx=1;}
  let isJudge=false;
  if(!opts||opts.length<2){if(aIdx===0||aIdx===1){opts=['对','错'];isJudge=true;}}
  else if(opts.length===2){const a=String(opts[0]),b=String(opts[1]);if((a==='对'||a==='正确')&&(b==='错'||b==='错误'))isJudge=true;}
  let e=stripTags(raw.explanation||raw.explain||raw.e||raw.analysis||raw.desc||raw.jiexi||raw.remark||raw.answerSkill||'');
  let ase=raw.answerSkillExplain?stripTags(String(raw.answerSkillExplain)):'';
  if(ase&&e.indexOf(ase)<0)e=e?(e+' '+ase):ase;
  let nr=(raw.newRuleFlag===true||raw.newRuleFlag===1||raw.newRule===true);
  let img=raw.url||raw.image||raw.img||'';
  if(img&&img.indexOf('http://')===0)img='https://'+img.slice(7);
  if(aIdx<0||aIdx>=(opts||[]).length||!q)return null;
  return {q:q,o:opts.map(String),a:aIdx,e:e,j:isJudge,nr:nr,img:img};
}
async function loadC1Bank(force){
  if(_c1bank&&!force)return _c1bank;
  if(!force){try{const c=JSON.parse(localStorage.getItem(C1BANK_KEY)||'null');if(c&&c.qs&&c.qs.length>=50){_c1bank=c;return c;}}catch(e){}}
  try{localStorage.removeItem('planner_c1bank');}catch(e){}
  if(_c1loading)return null;
  _c1loading=true;
  const SOURCES=[
    {u:'https://raw.githubusercontent.com/LiuMashiro/Exam-Question-Bank-for-Chinese-Driving-Test-Subject-1-Subject-4/main/Question-Bank.json',v:'2025新规(第172号令)',src:'LiuMashiro'},
    {u:'https://raw.githubusercontent.com/doupoa/DrivingTestSubjectOne/main/q.json',v:'2022-07',src:'doupoa(MIT)'},
    {u:'https://raw.githubusercontent.com/icecreamZeng/DriverEasy/main/questions.json',v:'2022-07',src:'DriverEasy(MIT)'}
  ];
  for(const s of SOURCES){
    try{
      const r=await fetch(s.u);
      if(!r.ok)continue;
      const data=await r.json();
      let arr=Array.isArray(data)?data:(data.questions||data.qs||data.list||[]);
      let qs=[],s1=0,s4=0;
      for(const raw of arr){const sb=raw?Number(raw.subject):0;if(sb===4){s4++;continue;}if(sb===1)s1++;const n=normQ(raw||{});if(n)qs.push(n);}
      if(s1===0&&s4>0&&qs.length<50)continue;
      if(qs.length<50)continue;
      const bank={v:s.v,src:s.src,d:todayKey(),total:qs.length,qs:qs};
      let saved=false;
      const sizes=[qs.length,2000,1500,1000,500];
      for(const n of sizes){
        if(n>qs.length)continue;
        const obj=n<qs.length?{v:bank.v,src:bank.src,d:bank.d,total:n,qs:bank.qs.slice(0,n)}:bank;
        try{localStorage.setItem(C1BANK_KEY,JSON.stringify(obj));_c1bank=obj;saved=true;break;}catch(e){continue;}
      }
      if(!saved)_c1bank=bank;
      _c1loading=false;return _c1bank;
    }catch(e){continue;}
  }
  _c1loading=false;return null;
}

function reloadC1Bank(){localStorage.removeItem(C1BANK_KEY);_c1bank=null;initC1BankUI();}
async function startC1Mode(mode){
  if(!_c1bank)toast('题库加载中，请稍候…');
  const bank=_c1bank||await loadC1Bank();
  if(!bank||!bank.qs||!bank.qs.length){toast('题库未就绪，请先在「资源」页加载题库');return;}
  let qs=bank.qs,list=[],title='';
  if(mode==='seq'){const prog=getC1Prog();let st=prog.seq%qs.length;list=qs.slice(st,st+50);if(list.length<50)list=list.concat(qs.slice(0,50-list.length));title='顺序练习（从第 '+(st+1)+' 题）';}
  else if(mode==='rand'){list=shuffleCopy(qs).slice(0,50);title='随机练习 50 题';}
  else if(mode==='wrong'){const w=getC1Wrong(),wq=Object.values(w);if(!wq.length){toast('错题本是空的，先去刷题产生错题吧');return;}list=wq.map(x=>({q:x.q,o:x.o,a:x.a,e:x.e,j:x.j,img:x.img||'',nr:x.nr||false}));title='错题复习（'+list.length+' 题）';}
  else if(mode==='exam'){list=shuffleCopy(qs).slice(0,100);title='模拟考 · 100 题 · 45 分钟';}
  const qlist=list.map(q=>({prompt:q.q,options:q.o.slice(),answer:q.a,explain:q.e,judge:q.j,img:q.img||'',nr:q.nr||false,_k:c1Key({q:q.q})}));
  quiz={qs:qlist,idx:0,score:0,picked:-1,title:title,mode:mode,started:Date.now(),deadline:mode==='exam'?Date.now()+45*60*1000:null,wrongAdd:[],wrongResolved:[]};
  renderQuiz();if(mode==='exam')startExamTimer();
}
function startExamTimer(){clearInterval(quizTimer);quizTimer=setInterval(()=>{if(!quiz||quiz.mode!=='exam'){clearInterval(quizTimer);return;}const left=Math.max(0,Math.floor((quiz.deadline-Date.now())/1000));const el=document.getElementById('quizTimer');if(el){const m=Math.floor(left/60),s=left%60;el.textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.style.color=left<300?'#ef4444':'';}if(left<=0){clearInterval(quizTimer);finishExamTimeout();}},1000);}

function renderQuiz(){
  const p=document.getElementById('quiz');const panel=document.getElementById('quizPanel');
  if(!quiz){p.hidden=true;clearInterval(quizTimer);return;}
  p.hidden=false;
  const timerHtml=quiz.mode==='exam'?'<span id="quizTimer" style="margin-left:8px;font-size:12px"></span>':'';
  if(quiz.idx>=quiz.qs.length){
    clearInterval(quizTimer);
    const pct=Math.round(quiz.score/quiz.qs.length*100);
    const exam=quiz.mode==='exam';
    const icon=exam?(pct>=90?'🎉 合格':'💪 未达标'):(pct>=80?'🎉':pct>=60?'👍':'💪');
    if(quiz.mode==='seq'||quiz.mode==='rand'||quiz.mode==='exam'){const prog=getC1Prog();prog.done+=quiz.qs.length;prog.right+=quiz.score;if(quiz.mode==='seq'&&_c1bank)prog.seq=(prog.seq+quiz.qs.length)%_c1bank.total;saveC1Prog(prog);}
    const w=getC1Wrong();quiz.wrongAdd.forEach(q=>{w[c1Key({q:q.prompt})]={q:q.prompt,o:q.options,a:q.answer,e:q.explain,j:q.judge||false,img:q.img||'',nr:q.nr||false};});quiz.wrongResolved.forEach(k=>{delete w[k];});saveC1Wrong(w);
    const extra=exam?'<div style="font-size:13px;color:var(--muted);margin-top:4px">'+(pct>=90?'合格线 90 分，恭喜通过！':'科目一合格线 90 分，多练错题再战')+'</div>':'';
    panel.innerHTML='<div style="text-align:center"><div style="font-size:30px">'+icon+'</div><div style="font-size:18px;font-weight:700;margin:6px 0">'+quiz.score+' / '+quiz.qs.length+'</div><div style="font-size:13px;color:var(--muted)">正确率 '+pct+'%</div>'+extra+'<div class="pills" style="justify-content:center;margin-top:14px">'+(quiz.mode!=='wrong'?'<button class="btn small" onclick="startC1Mode(\'wrong\')">复习错题</button> ':'')+'<button class="btn ghost small" onclick="'+replayOnClick()+'">再来一组</button> <button class="btn ghost small" onclick="closeQuiz()">关闭</button></div></div>';

  q.options.forEach((o,i)=>{let cls='',dis='';if(quiz.picked>=0){dis='disabled';if(i===q.answer)cls='correct';else if(i===quiz.picked)cls='wrong';}const prefix=(q.options.length===2&&q.judge)?'':(String.fromCharCode(65+i)+'. ');opts+='<button class="q-opt '+cls+'" '+dis+' onclick="pickQ('+i+')">'+escapeHtml(prefix+o)+'</button>';});
  const last=quiz.idx>=quiz.qs.length-1;
  const nrBadge=q.nr?'<span style="font-size:11px;background:#10b981;color:#fff;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle">2025新规</span>':'';
  const imgHtml=q.img?'<img src="'+escapeHtml(q.img)+'" onerror="this.style.display=\'none\'" referrerpolicy="no-referrer" loading="lazy" style="max-width:100%;max-height:200px;border-radius:8px;margin:6px 0;display:block" alt="题图">':'';
  panel.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">'+quiz.title+'</b><button class="btn ghost small" onclick="closeQuiz()">✕</button></div><div class="q-prog">第 '+(quiz.idx+1)+' / '+quiz.qs.length+' 题 · 已对 '+quiz.score+timerHtml+'</div><div class="q-prompt">'+escapeHtml(q.prompt)+nrBadge+'</div>'+imgHtml+opts+(quiz.picked>=0?'<div class="q-exp">💡 '+escapeHtml(q.explain||'')+(quiz.picked===q.answer?' · 正确':' · 答错了')+'</div><div style="text-align:right;margin-top:6px"><button class="btn small" onclick="nextQ()">'+(last?'完成查看结果':'下一题 ›')+'</button></div>':'');
}

const RKEY='planner_remind',RFDKEY='planner_remind_fired';

function remindTick(){
  const cfg=getRemindCfg(); if(!cfg.enabled)return;
  if('Notification'in window && Notification.permission!=='granted')return;
  const now=new Date(),tk=todayKey();
  if(firedToday._date!==tk){firedToday={_date:tk};saveFired();}
  const hm=pad(now.getHours())+':'+pad(now.getMinutes());
  remindScheduleFor(now).forEach(it=>{
    const fireAt=addMin(it.t,-cfg.advanceMin);
    const key=fireAt+'_'+it.t;
    if(fireAt===hm && !firedToday[key]){firedToday[key]=1;saveFired();fireNotify(it.label,it.g);}
  });
}
/* ===== Service Worker 注册（PWA / 离线 / 可安装到桌面） ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(){}).catch(function(){/* file:// 下无法注册，属正常；用本地服务器或云端部署后即可 */});
  });
}
loadFired();
setInterval(remindTick,20000);
remindTick();
</script>
